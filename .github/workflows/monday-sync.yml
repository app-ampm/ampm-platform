name: monday-sync

# Keeps the "AMPM Platform — Build Plan" monday board in step with merges.
# When a PR is merged, any `Monday: <card-key> <state>` trailers in its
# description move the card's Status, stamp "Completed on" (for `done`), and
# post a progress note to the card. See docs/tools/monday-sync.md.
#
# Requires repo secret MONDAY_API_TOKEN (a monday.com personal API token).
# The workflow only takes effect once it is present on the default branch.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  sync:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync board from PR trailers
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" | python3 docs/tools/monday_sync.py --from-pr
