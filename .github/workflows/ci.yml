# Every push to main and every pull request: install, generate, format check, lint + typecheck + test, build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # prisma generate reads prisma.config.ts, which requires the variable; no database is contacted.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      CI: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm build --filter=web --filter=api
