# Every push to main and every pull request: install, generate, format check, lint + typecheck + test
# (the API's e2e suite against a disposable PostgreSQL) and the docs/tools tests (the transcript
# redactor and the memory hooks), the matrix drift check, the builds, then the mobile bundles for web,
# iOS and Android.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ampm
          POSTGRES_PASSWORD: ampm
          POSTGRES_DB: ampm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ampm" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: true
      # prisma generate reads prisma.config.ts; the e2e suite migrates and seeds the disposable database.
      DATABASE_URL: postgresql://ampm:ampm@localhost:5432/ampm_test
      DATABASE_URL_TEST: postgresql://ampm:ampm@localhost:5432/ampm_test
      IDENTITY_PROVIDER: local
      IDENTITY_LOCAL_SECRET: ci-local-secret-that-is-long-enough-for-hs256-ok
      # The e2e proves the custom-role path; production leaves this off until the admin surface lands (D-036).
      DYNAMIC_ROLES: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm format:check
      - run: pnpm check
      - name: Permission matrix drift (docs/permission-matrix.md vs packages/policy/src/generated)
        run: pnpm authz:generate && git diff --exit-code -- packages/policy/src/generated
      - run: pnpm build --filter=web --filter=api
      # The Expo app is bundled for every platform: lint and typecheck do not resolve native or web-only
      # modules, so a module Metro cannot bundle (expo-sqlite's web worker, 27 Oct 2026) passes them.
      - name: Mobile bundles (web, iOS, Android)
        run: pnpm --filter mobile bundle:check

  # Infrastructure as code (feature 6.1+): validate the Compose stacks on every change. Docker is
  # preinstalled on the runner, so this needs no Node/pnpm setup.
  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # A dummy AMPM_IMAGE so the production/staging stacks (which require it, with no default) validate.
      - name: Validate Compose files (local, production, staging)
        env:
          AMPM_IMAGE: config-check
        run: |
          docker compose -f infra/compose/local/compose.yml config -q
          docker compose -f infra/compose/production/compose.yml config -q
          docker compose -f infra/compose/staging/compose.yml config -q
      # Build the actual deploy artifact so a Dockerfile/build regression cannot ship green (the image
      # is not otherwise exercised by CI; the registry push and digest pin are feature 6.6).
      - name: Build the server image
        run: docker build -f infra/docker/Dockerfile -t ampm:ci .
