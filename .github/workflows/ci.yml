# CI, scoped to the changes in each push and pull request so a small change does not pay for the
# whole matrix. A `changes` job classifies the diff with dependency-aware path filters (a change to
# a shared package counts as a change to every workspace that consumes it); each downstream job runs
# only when its area is touched. The lint/typecheck/test/build jobs then narrow to Turborepo's
# affected set for a package-scoped change, but run a FULL validation when a repo-root / toolchain /
# lint-config file changes — turbo `--affected` attributes a root-file change to no package, so it
# would otherwise validate nothing (that is the `shared` output below). What runs when:
#   format        always              prettier --check over the whole tree (covers prettier config + docs)
#   quality       non-api code        turbo lint + typecheck + test (affected, or full on a shared change), API excluded
#   api           api or its deps     API lint + typecheck + unit + e2e against a disposable PostgreSQL
#   build         web/api or deps     next build / nest build (affected, or both on a shared change)
#   mobile        mobile or its deps  Expo bundle for web, iOS and Android (Metro resolves what lint/tsc cannot)
#   matrix        policy or the doc   regenerate packages/policy/src/generated and fail on drift
#   tools         docs/tools changed  the redactor, memory-hook and checkpoint self-tests
#   secrets-scan  always              refuse any committed plaintext secret (feature 6.4)
#   infra         infra changed       shellcheck + Compose/Caddy validation + the container-stack smoke (heavy)
# `ci-ok` is a single stable status (green when every job that ran passed; skipped jobs are fine) so
# branch protection can require one check regardless of which jobs a given change triggers.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  # Base/head for `turbo run --affected`. PRs diff against the target branch; pushes against the
  # commit that was there before. Full history (fetch-depth: 0) is needed for turbo to find the base.
  TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
  TURBO_SCM_HEAD: ${{ github.sha }}

jobs:
  # Classify the diff once; every other job gates on these outputs. Filters are dependency-aware:
  # a workspace's filter includes the sources of every @ampm package it depends on, so a change to
  # packages/core triggers api + mobile (its consumers). `shared` collects the repo-root / toolchain /
  # lint-config files that can affect every workspace; it is folded into the app/package filters and
  # is exported so quality/build run a FULL (non-affected) validation when it is true. Prettier config
  # is deliberately NOT in `shared` — only the always-on `format` job cares about it.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      code_non_api: ${{ steps.filter.outputs.code_non_api }}
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      mobile: ${{ steps.filter.outputs.mobile }}
      matrix: ${{ steps.filter.outputs.matrix }}
      tools: ${{ steps.filter.outputs.tools }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Leaf anchors are flat lists of globs; composite filters compose them (paths-filter
          # flattens one level of nesting, so composites reference only flat leaves, never each other).
          filters: |
            toolchain: &toolchain
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - '.nvmrc'
              - 'turbo.json'
            lintcfg: &lintcfg
              - 'eslint.config.*'
              - 'packages/config/**'
            workflow: &workflow
              - '.github/workflows/ci.yml'
            tokens_src: &tokens_src
              - 'packages/tokens/**'
            core_src: &core_src
              - 'packages/core/**'
            policy_src: &policy_src
              - 'packages/policy/**'
            ui_src: &ui_src
              - 'packages/ui/**'
            apiclient_src: &apiclient_src
              - 'packages/api-client/**'
            shared:
              - *toolchain
              - *lintcfg
              - *workflow
            web:
              - *toolchain
              - *lintcfg
              - *workflow
              - *tokens_src
              - 'apps/web/**'
            api:
              - *toolchain
              - *lintcfg
              - *workflow
              - *core_src
              - *policy_src
              - 'apps/api/**'
            mobile:
              - *toolchain
              - *lintcfg
              - *workflow
              - *core_src
              - *tokens_src
              - *ui_src
              - *apiclient_src
              - 'apps/mobile/**'
            matrix:
              - *toolchain
              - *workflow
              - *policy_src
              - 'docs/permission-matrix.md'
            tools:
              - *workflow
              - 'docs/tools/**'
            infra:
              - *toolchain
              - *workflow
              - 'infra/**'
              - '.dockerignore'
            code_non_api:
              - *toolchain
              - *lintcfg
              - *workflow
              - *tokens_src
              - *core_src
              - *policy_src
              - *ui_src
              - *apiclient_src
              - 'apps/web/**'
              - 'apps/mobile/**'

  # Formatting covers every file type (code, docs, prettier config), so it runs on every change.
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # No --ignore-scripts: the root `prepare` builds @ampm/tokens, whose Tailwind preset the
      # prettier-plugin-tailwindcss config loads; without it prettier cannot resolve the config.
      - run: pnpm install --frozen-lockfile
      - name: Prettier formatting check (whole repo)
        run: pnpm format:check

  # Lint + typecheck + test, API excluded (its tests need a database and run in their own job). For a
  # package-scoped change, --affected narrows to the changed packages and their dependents. For a
  # `shared` change (toolchain / lint config / the workflow) turbo --affected would attribute the
  # root-file change to NO package and validate nothing, so run the full non-API set instead.
  quality:
    needs: changes
    if: ${{ needs.changes.outputs.code_non_api == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint, typecheck and test (excluding the API)
        run: |
          if [ "${{ needs.changes.outputs.shared }}" = "true" ]; then
            pnpm exec turbo run lint typecheck test --filter='!api'
          else
            pnpm exec turbo run lint typecheck test --affected --filter='!api'
          fi

  # The API is isolated because only it needs PostgreSQL. It runs its full lint + typecheck + test
  # (unit, then the e2e suite that migrates and seeds the disposable database).
  api:
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ampm
          POSTGRES_PASSWORD: ampm
          POSTGRES_DB: ampm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ampm" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: true
      # prisma generate reads prisma.config.ts; the e2e suite migrates and seeds the disposable database.
      DATABASE_URL: postgresql://ampm:ampm@localhost:5432/ampm_test
      DATABASE_URL_TEST: postgresql://ampm:ampm@localhost:5432/ampm_test
      IDENTITY_PROVIDER: local
      IDENTITY_LOCAL_SECRET: ci-local-secret-that-is-long-enough-for-hs256-ok
      # The e2e proves the custom-role path; production leaves this off until the admin surface lands (D-036).
      DYNAMIC_ROLES: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Lint, typecheck and test the API (unit + e2e against PostgreSQL)
        run: pnpm exec turbo run lint typecheck test --filter=api

  # Compile the affected apps (Next.js for web, Nest for the API). lint/typecheck do not exercise the
  # bundlers, so a change that only breaks the build is caught here. A `shared` change builds both.
  build:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' || needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Build affected apps
        run: |
          if [ "${{ needs.changes.outputs.shared }}" = "true" ]; then
            pnpm exec turbo run build --filter=web --filter=api
          else
            pnpm exec turbo run build --affected
          fi

  # The Expo app is bundled for every platform: lint and typecheck do not resolve native or web-only
  # modules, so a module Metro cannot bundle (expo-sqlite's web worker, 27 Oct 2026) passes them.
  mobile:
    needs: changes
    if: ${{ needs.changes.outputs.mobile == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Mobile bundles (web, iOS, Android)
        run: pnpm --filter mobile bundle:check

  # The permission matrix is generated from docs/permission-matrix.md; CI fails if the committed
  # output drifts from the document. Scoped to its own inputs plus install/workflow — not lint config.
  matrix:
    needs: changes
    if: ${{ needs.changes.outputs.matrix == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Permission matrix drift (docs/permission-matrix.md vs packages/policy/src/generated)
        run: pnpm authz:generate && git diff --exit-code -- packages/policy/src/generated

  # The docs/tools suite (transcript redactor and the memory + checkpoint hooks) is Python/Bash and
  # does not touch the workspaces, so it runs only when those tools or the workflow change.
  tools:
    needs: changes
    if: ${{ needs.changes.outputs.tools == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: docs/tools tests (redactor, memory + checkpoint hooks)
        run: pnpm run test:tools

  # A committed plaintext secret could land in any file, so this runs on every change (feature 6.4):
  # reuse the transcript redactor's detector over every tracked file, and refuse any plaintext-secret
  # file by location.
  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Scan for committed plaintext secrets
        run: |
          python3 docs/tools/scan_secrets.py --self-test
          python3 docs/tools/scan_secrets.py

  # Infra validation + container-stack smoke (heavy: builds both images and runs the stack). Gated to
  # infra sources and the toolchain baked into the images, so app-only changes — whose correctness the
  # build and api jobs already cover — do not pay the ~25-minute smoke.
  infra:
    needs: changes
    if: ${{ needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # Lint every infra shell script (feature 6.5 requires bootstrap.sh shellcheck-green). shellcheck is
      # preinstalled on ubuntu-latest and supersedes a bare `sh -n` syntax check.
      - name: shellcheck the infra scripts
        run: find infra -type f -name '*.sh' -print0 | xargs -0r shellcheck
      # Dummy values so the production/staging stacks (which require AMPM_IMAGE/AMPM_POSTGRES_IMAGE/
      # AMPM_DOMAIN/ACME_EMAIL with no default) validate.
      - name: Validate Compose files (local, production, staging)
        env:
          AMPM_IMAGE: config-check
          AMPM_POSTGRES_IMAGE: config-check
          AMPM_DOMAIN: config-check
          ACME_EMAIL: ops@example.com
        run: |
          docker compose -f infra/compose/local/compose.yml config -q
          docker compose -f infra/compose/production/compose.yml config -q
          docker compose -f infra/compose/staging/compose.yml config -q
      # Parse the Caddyfile so a syntax/header typo in the edge config cannot ship green (feature 6.2).
      - name: Validate the Caddyfile
        run: |
          docker run --rm -e AMPM_DOMAIN=localhost \
            -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile
      # Build both images, bring the whole local stack up, and exercise the edge (HTTPS + headers) and the
      # pgBackRest runtime (scheduler bootstrap -> stanza-create + full backup + check + job_runs) end to
      # end, then tear down. This also covers both Dockerfile builds (a build regression fails `up --build`)
      # and the backup scripts' real behaviour. The S3 repo needs secrets, so only the posix path runs here;
      # the registry push and digest pin are feature 6.6.
      - name: Smoke the container stack (edge + backups)
        run: sh infra/scripts/smoke.sh

  # One required status for branch protection: green when every job that ran passed. Skipped jobs are
  # expected (that is the whole point), so only failure/cancellation fails the gate. `needs.*.result`
  # covers every job in `needs:` automatically, so a new job is included the moment it is added there.
  ci-ok:
    if: ${{ always() }}
    needs: [changes, format, quality, api, build, mobile, matrix, tools, secrets-scan, infra]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every triggered job to have passed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Job results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required CI job did not pass ($r)."
              exit 1
            fi
          done
          echo "All required jobs passed (skipped jobs are OK)."
