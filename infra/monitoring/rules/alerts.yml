# AMPM alert rules (feature 6.7, D-054; vps-setup.md §7). The thresholds live here as code (infra rule
# D-015). Every alert carries a `runbook` annotation pointing at the step in infra/runbooks/monitoring.md
# that says what to do — an alert that fires without a runbook step is a bug (that rule, D-015).
#
# Wedding-day mode: while a project is live the app exposes ampm_wedding_live == 1, and the Wedding* rules
# below re-check the same signals at tighter thresholds. They are gated with `and on() (max(ampm_wedding_live)
# == 1)`, so they stay silent whenever the flag is 0 or absent (the safe default before the app ships the
# /metrics endpoint). The app-metric rules (jobs, webhooks) and the wedding rules therefore produce no
# series — and never page — until that endpoint exists.
groups:
  - name: host
    rules:
      - alert: NodeExporterDown
        expr: up{job="node"} == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "node-exporter is down — the host is unmonitored"
          description: "Prometheus cannot scrape node-exporter (down for at least 5m); disk/memory/CPU and the backup metrics are all blind."
          runbook: "infra/runbooks/monitoring.md#nodeexporterdown"

      - alert: HostDiskFillingUp
        # Used space over 80% on any real filesystem (exclude virtual/overlay mounts).
        expr: |
          (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|fuse.*"}
             / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|fuse.*"}) > 0.80
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Disk over 80% on {{ $labels.mountpoint }}"
          description: "{{ $labels.mountpoint }} is {{ $value | humanizePercentage }} full. WAL, backups-in-flight and logs need headroom."
          runbook: "infra/runbooks/monitoring.md#hostdiskfillingup"

      - alert: HostMemoryHigh
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.90
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Memory over 90%"
          description: "Available memory is {{ $value | humanizePercentage }} used; Postgres (6g) + the app risk the OOM killer."
          runbook: "infra/runbooks/monitoring.md#hostmemoryhigh"

      - alert: HostCPUSaturated
        expr: 1 - avg without (cpu) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.90
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "CPU over 90% for 15m"
          description: "Sustained CPU saturation ({{ $value | humanizePercentage }} busy); check for a runaway query or job backlog."
          runbook: "infra/runbooks/monitoring.md#hostcpusaturated"

  - name: backups
    rules:
      - alert: BackupTooOld
        # The newest successful pgBackRest backup is older than 26h (a daily schedule missed its window).
        expr: time() - max(ampm_pgbackrest_last_backup_timestamp_seconds) > 26 * 3600
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: "No successful backup in over 26h"
          description: "The last successful pgBackRest backup finished {{ $value | humanizeDuration }} ago; the recovery point is slipping."
          runbook: "infra/runbooks/monitoring.md#backuptooold"

      - alert: BackupMetricsMissing
        # The collector never produced a backup timestamp: it is down, or no backup has ever succeeded.
        expr: absent(ampm_pgbackrest_last_backup_timestamp_seconds)
        for: 2h
        labels: { severity: warning }
        annotations:
          summary: "No backup metric is being reported"
          description: "ampm_pgbackrest_last_backup_timestamp_seconds has been absent for 2h — the metrics collector or the backups are not running."
          runbook: "infra/runbooks/monitoring.md#backupmetricsmissing"

      - alert: WALArchiveLagging
        # WAL is forced every 60s; 10 min without a new archived segment means archiving is stuck and the
        # PITR window has frozen (and pg_wal will start to fill).
        expr: ampm_pg_archive_age_seconds > 600
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "WAL archiving is lagging (>10m)"
          description: "The last WAL segment was archived {{ $value | humanizeDuration }} ago; point-in-time recovery is frozen and pg_wal is growing."
          runbook: "infra/runbooks/monitoring.md#walarchivelagging"

      - alert: WALArchiveFailing
        expr: increase(ampm_pg_archive_failed_total[15m]) > 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "WAL archive_command is failing"
          description: "pg_stat_archiver recorded {{ $value }} archive failures in 15m (repo auth, cipher, or S3 reachability)."
          runbook: "infra/runbooks/monitoring.md#walarchivefailing"

      - alert: MetricsCollectorStale
        # The db-metrics collector heartbeat stopped: the backup/archive metrics above are now stale and
        # must not be trusted.
        expr: (time() - ampm_collector_last_run_timestamp_seconds > 300) or absent(ampm_collector_last_run_timestamp_seconds)
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "The metrics collector is stale"
          description: "ampm_collector_last_run_timestamp_seconds has not advanced for >5m; backup/archive age metrics are stale."
          runbook: "infra/runbooks/monitoring.md#metricscollectorstale"

  - name: edge
    rules:
      - alert: EdgeProbeDown
        expr: probe_success == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "The edge is not serving 200 (internal probe)"
          description: "The in-box blackbox probe of {{ $labels.instance }} has failed for 5m — Caddy or the API is down."
          runbook: "infra/runbooks/monitoring.md#edgeprobedown"

      - alert: CertificateExpiringSoon
        # Caddy renews at ~1/3 of lifetime (≈30 days before expiry for a 90-day cert); under 14 days means
        # renewal has been failing for weeks. The remaining-time comparison is the top-level left operand so
        # $value is seconds-remaining (humanizeDuration -> "13d"), not the absolute expiry timestamp.
        expr: ((probe_ssl_earliest_cert_expiry - time()) < 14 * 86400) and (probe_ssl_earliest_cert_expiry > 0)
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "TLS certificate expires in under 14 days"
          description: "{{ $labels.instance }} presents a cert expiring in {{ $value | humanizeDuration }}; Caddy's auto-renewal is failing."
          runbook: "infra/runbooks/monitoring.md#certificateexpiringsoon"

  - name: app
    rules:
      - alert: JobFailuresHigh
        expr: increase(ampm_jobs_failed_total[15m]) > 5
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "Background job failures are elevated"
          description: "{{ $value }} job failures in 15m (ampm_jobs_failed_total)."
          runbook: "infra/runbooks/monitoring.md#jobfailureshigh"

      - alert: WebhookFailuresHigh
        expr: increase(ampm_webhook_failures_total[15m]) > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Outbound webhook deliveries are failing"
          description: "{{ $value }} webhook delivery failures in 15m (ampm_webhook_failures_total)."
          runbook: "infra/runbooks/monitoring.md#webhookfailureshigh"

  - name: wedding-day
    rules:
      - alert: WeddingDiskPressure
        expr: |
          ((1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|fuse.*"}
              / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|fuse.*"}) > 0.70)
          and on() (max(ampm_wedding_live) == 1)
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Wedding-day mode: disk over 70% on {{ $labels.mountpoint }}"
          description: "A project is live and {{ $labels.mountpoint }} is {{ $value | humanizePercentage }} full — act before the event, not after."
          runbook: "infra/runbooks/monitoring.md#wedding-day-mode"

      - alert: WeddingMemoryPressure
        expr: ((1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.80) and on() (max(ampm_wedding_live) == 1)
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Wedding-day mode: memory over 80%"
          description: "A project is live and memory is {{ $value | humanizePercentage }} used."
          runbook: "infra/runbooks/monitoring.md#wedding-day-mode"

      - alert: WeddingBackupStale
        expr: (time() - max(ampm_pgbackrest_last_backup_timestamp_seconds) > 13 * 3600) and on() (max(ampm_wedding_live) == 1)
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: "Wedding-day mode: backup older than 13h"
          description: "A project is live and the last successful backup finished {{ $value | humanizeDuration }} ago."
          runbook: "infra/runbooks/monitoring.md#wedding-day-mode"

      - alert: WeddingWALArchiveLag
        expr: (ampm_pg_archive_age_seconds > 300) and on() (max(ampm_wedding_live) == 1)
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Wedding-day mode: WAL archiving lagging (>5m)"
          description: "A project is live and the last WAL segment was archived {{ $value | humanizeDuration }} ago."
          runbook: "infra/runbooks/monitoring.md#wedding-day-mode"

      - alert: WeddingCertExpiring
        expr: (((probe_ssl_earliest_cert_expiry - time()) < 21 * 86400) and (probe_ssl_earliest_cert_expiry > 0)) and on() (max(ampm_wedding_live) == 1)
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: "Wedding-day mode: TLS certificate expires in under 21 days"
          description: "A project is live and {{ $labels.instance }} presents a cert expiring in {{ $value | humanizeDuration }}."
          runbook: "infra/runbooks/monitoring.md#wedding-day-mode"
