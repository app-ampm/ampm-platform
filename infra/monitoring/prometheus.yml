# Prometheus scrape + alerting config for one AMPM VPS environment (feature 6.7, D-054; vps-setup.md §7).
# Mounted read-only into the prometheus container in production/staging and the local `monitoring`
# profile. Prometheus does NOT expand environment variables in this file, so everything here is static;
# the only per-environment value — the public domain the edge probe targets — is injected by Compose as a
# rendered file (the `blackbox_targets` config, see the compose files), never templated here. No secret
# ever appears in this file (infra rule, D-015): the stack's one secret, the Alertmanager paging URL,
# lives in a sops-managed file read only by Alertmanager.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    monitor: ampm
    # Environments are separated physically: each runs its own Prometheus + Alertmanager, and the
    # per-environment paging webhook (sops) decides how loudly an alert pages. Staging and production
    # therefore never cross-fire, so no `environment` label is needed to tell them apart.

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    # Host CPU / memory / disk / load from node-exporter, plus the pgBackRest + archive metrics the
    # collector writes into node-exporter's textfile directory (ampm_pgbackrest_*, ampm_pg_archive_*).
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: api
    # The application's own metrics: ampm_jobs_failed_total, ampm_webhook_failures_total, and
    # ampm_wedding_live (the flag that turns on wedding-day mode). The /metrics endpoint is added by a
    # later app feature; until it exists this target is simply down and the app-metric alerts have no
    # series, so they stay silent (they are written to fire only on real data, never on absent data).
    # There is deliberately NO "api metrics target is down" alert — it would page continuously until the
    # endpoint ships. Edge/app availability is covered by the blackbox probe and the external uptime
    # monitor instead.
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3900"]

  - job_name: blackbox
    # Synthetic probe of the public edge FROM INSIDE the box (complements the external uptime monitor,
    # which watches from outside): reachability, HTTP status, and the TLS certificate's expiry
    # (probe_ssl_earliest_cert_expiry). The probe target is the real domain and comes from a
    # Compose-rendered file so it is never hard-coded here.
    metrics_path: /probe
    params:
      module: [https_2xx]
    file_sd_configs:
      - files: ["/etc/prometheus/targets/edge.yml"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
