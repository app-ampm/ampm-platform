# PostgreSQL client authentication (vps-setup.md §5, D-050). scram-sha-256 everywhere, no trust/peer, no
# external host lines — defence in depth behind the network isolation. Postgres is never published (only
# Caddy publishes ports). In prod/staging it also joins the outbound-only `egress` bridge for WAL push to
# S3 and so listens there too (listen_addresses='*'); `samenet` therefore authorises that subnet as well,
# but nothing is reachable from outside the host. Auth is scoped to the single application role `ampm`
# (the only role) across all databases — pgBackRest's control connection uses `postgres`/`template1`, so
# DATABASE stays `all`; USER is pinned so any other role is rejected.
#
# TYPE   DATABASE  USER   ADDRESS        METHOD
local    all       ampm                  scram-sha-256
host     all       ampm   samenet        scram-sha-256
host     all       ampm   127.0.0.1/32   scram-sha-256
host     all       ampm   ::1/128        scram-sha-256
