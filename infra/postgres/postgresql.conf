# PostgreSQL 16 tuning for the AMPM VPS (vps-setup.md §3, D-050). Mounted read-only into the postgres
# container and loaded with `-c config_file=`. Tuned to the KVM 4 box (16 GB, Postgres gets ~6 GB); WAL
# archives to pgBackRest so the recovery point is about one minute. Values a developer would change for a
# bigger box are grouped at the top.

# --- connectivity (postgres is on the internal network only; pg_hba restricts auth) ---
listen_addresses = '*'

# --- sizing (KVM 4: 16 GB RAM, Postgres budget ~6 GB) ---
shared_buffers = 1536MB            # ~a quarter of Postgres's memory budget
effective_cache_size = 4GB
maintenance_work_mem = 256MB
work_mem = 16MB
max_connections = 100

# --- write-ahead log + archiving (pgBackRest; vps-setup §4) ---
wal_level = replica                # enough for pgBackRest and a future streaming standby
archive_mode = on
# pgBackRest pushes each segment; the stanza and repo come from pgbackrest.conf / PGBACKREST_* env.
archive_command = 'pgbackrest --stanza=ampm archive-push %p'
archive_timeout = 60s              # force a segment at least once a minute -> ~1 min recovery point
max_wal_senders = 3                # headroom for a future standby
wal_compression = on
checkpoint_timeout = 15min
max_wal_size = 2GB
min_wal_size = 256MB

# --- logging (to stderr -> the container log driver + rotation, vps-setup §5) ---
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 1000  # log statements slower than 1s
log_checkpoints = on
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
timezone = 'UTC'

# --- safety ---
password_encryption = scram-sha-256
