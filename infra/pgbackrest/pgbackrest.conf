# pgBackRest configuration (vps-setup.md §4, D-050). The stable settings live here; the repo BACKEND is
# env-driven (PGBACKREST_* vars), so the local smoke uses a filesystem (posix) repo and production uses
# the encrypted S3 bucket in Mumbai (wired at deploy, feature 6.4) from the same config:
#   local:       PGBACKREST_REPO1_TYPE unset (posix) + repo1-path below + a test PGBACKREST_REPO1_CIPHER_PASS
#   production:  PGBACKREST_REPO1_TYPE=s3, PGBACKREST_REPO1_PATH (the S3 prefix, overriding repo1-path
#                below), PGBACKREST_REPO1_S3_{BUCKET,ENDPOINT,REGION,KEY,KEY_SECRET},
#                PGBACKREST_REPO1_CIPHER_PASS   (all from the sops-decrypted env)
[global]
repo1-path=/var/lib/pgbackrest
# Keep enough full backups to guarantee a >=14-day restore window (infra rule D-015: "fourteen days").
# Time-based, not count-based: with weekly fulls a count of 2 drops the floor to 7 days every Sunday,
# whereas time=14 keeps every full needed to go back 14 days (~2-3 fulls -> the rule's "two full sets").
# Archive (WAL) retention is left unset so pgBackRest keeps the WAL for every retained full, giving PITR
# across the whole window; WAL older than the oldest retained full is expired, so it stays bounded.
repo1-retention-full-type=time
repo1-retention-full=14
# The repository is always encrypted; the passphrase is supplied by PGBACKREST_REPO1_CIPHER_PASS.
repo1-cipher-type=aes-256-cbc
process-max=2
start-fast=y
archive-async=y
spool-path=/var/spool/pgbackrest
log-level-console=info
log-level-file=off

[ampm]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
pg1-port=5432
pg1-user=ampm
