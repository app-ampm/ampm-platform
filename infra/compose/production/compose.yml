# The production stack on the VPS (vps-setup.md §1, D-048). Image-based: the image is built and pushed
# by the deploy workflow (feature 6.6) and pinned there by tag and digest. AMPM_IMAGE is an
# interpolation-time variable (the shell env or a compose-dir .env the deploy sets) — NOT a container
# env var, so it is not in production.env. It has no default: an unpinned `up` fails loudly rather than
# silently pulling a mutable tag. Secrets come from the sops-decrypted production.env at deploy (feature
# 6.4; production.env.example lists the keys). The full Caddyfile — TLS, HSTS, security headers, edge
# rate limits, static site — is feature 6.2; pgBackRest (6.3) and node-exporter (6.7) are added as their
# features land. Postgres and Redis stay on the internal network; only Caddy publishes ports.
name: ampm

x-app: &app
  image: ${AMPM_IMAGE:?set AMPM_IMAGE to the released tag@sha256 digest (the deploy workflow sets it)}
  env_file:
    - path: ./production.env
      required: false
  read_only: true
  tmpfs: ["/tmp"]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-bookworm
    # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB come from the sops-decrypted env (feature 6.4);
    # postgresql.conf tuning and the pgBackRest archive command are feature 6.3.
    env_file:
      - path: ./production.env
        required: false
    volumes: ["pgdata:/var/lib/postgresql/data"]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ampm} -d $${POSTGRES_DB:-ampm}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "2", memory: 6g }

  redis:
    image: redis:7-alpine
    # Password required at start (fail closed): an empty/unset REDIS_PASSWORD must not disable auth.
    # No persistence (nothing in Redis is the only copy, D-031).
    command:
      - sh
      - -c
      - exec redis-server --save "" --appendonly no --requirepass "$${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    env_file:
      - path: ./production.env
        required: false
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512m }

  api:
    <<: *app
    command: ["node", "dist/main.js"]
    environment:
      NODE_ENV: production
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [internal, edge]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3900/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g }

  worker:
    <<: *app
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      JOB_WORKER: "true"
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1", memory: 1g }

  caddy:
    image: caddy:2-alpine
    depends_on: [api]
    # The only published ports of the stack (vps-setup §5: firewall allows 80 and 443).
    ports: ["80:80", "443:443"]
    # The public edge gets ONLY the two non-secret vars it needs (no env_file, so none of the backend
    # secrets reach the most-attackable container). `:?` fails the deploy loudly if either is unset, so
    # the edge never silently falls back to a localhost/internal-CA certificate in production.
    environment:
      AMPM_DOMAIN: ${AMPM_DOMAIN:?AMPM_DOMAIN must be set (the public domain)}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be set (the Let's Encrypt contact)}
    volumes:
      - ../../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }

volumes:
  pgdata:
  caddy-data:
  caddy-config:

networks:
  internal: { internal: true }
  edge: {}
