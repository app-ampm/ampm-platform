# Template for the app secret zone (feature 6.4): the api and worker. Copy to infra/secrets/<env>.app.yaml,
# fill, and encrypt to infra/secrets/<env>.app.enc.yaml with sops. Consumed by: the api and worker services.
# Holds connection URLs (which embed the DB / Redis passwords the app needs) plus the provider keys — but
# NOT the raw POSTGRES_PASSWORD or the pgBackRest cipher / S3 keys, which stay in the postgres zone.
NODE_ENV: production
PORT: "3900"
DATABASE_URL: postgresql://ampm:change-me-via-sops@postgres:5432/ampm
REDIS_URL: redis://:change-me-via-sops@redis:6379
IDENTITY_PROVIDER: cognito
COGNITO_REGION: ap-south-1
COGNITO_USER_POOL_ID: ap-south-1_xxxxxxxxx
COGNITO_CLIENT_ID: xxxxxxxxxxxxxxxxxxxxxxxxxx
TRUST_PROXY: "1"
WEB_APP_URL: https://app.example.com
CORS_ORIGINS: https://app.example.com
EMAIL_PROVIDER: smtp
SMTP_HOST: email-smtp.ap-south-1.amazonaws.com
SMTP_USER: change-me-via-sops
SMTP_PASSWORD: change-me-via-sops
EMAIL_FROM: AMPM <no-reply@example.com>
# Razorpay (when payments land): test keys on staging, live keys on production.
RAZORPAY_KEY_ID: change-me-via-sops
RAZORPAY_KEY_SECRET: change-me-via-sops
# Sentry error reporting (feature 6.7): the app + worker read SENTRY_DSN to report errors to Sentry
# (external, hosted). The SDK is wired by a later app feature; this is the seam. A DSN is a write-only
# ingest key, but still environment-specific — use a separate Sentry project/DSN for staging vs production.
SENTRY_DSN: https://change-me-via-sops@o000000.ingest.sentry.io/0000000
