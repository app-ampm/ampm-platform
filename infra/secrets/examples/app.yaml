# Template for the app secret zone (feature 6.4): the api and worker. Copy to infra/secrets/<env>.app.yaml,
# fill, and encrypt to infra/secrets/<env>.app.enc.yaml with sops. Consumed by: the api and worker services.
# Holds connection URLs (which embed the DB / Redis passwords the app needs) plus the provider keys — but
# NOT the raw POSTGRES_PASSWORD or the pgBackRest cipher / S3 keys, which stay in the postgres zone.
NODE_ENV: production
PORT: "3900"
DATABASE_URL: postgresql://ampm:change-me-via-sops@postgres:5432/ampm
REDIS_URL: redis://:change-me-via-sops@redis:6379
# AMPM's own sign-in (D-142): the token-signing secret and the key that encrypts the staff authenticator
# secrets (base64 of 32 random bytes).
IDENTITY_PROVIDER: ampm
AUTH_TOKEN_SECRET: change-me-via-sops-at-least-32-characters
AUTH_ENCRYPTION_KEY: change-me-base64-of-32-random-bytes
TRUST_PROXY: "1"
WEB_APP_URL: https://app.example.com
CORS_ORIGINS: https://app.example.com
EMAIL_PROVIDER: smtp
SMTP_HOST: email-smtp.ap-south-1.amazonaws.com
SMTP_USER: change-me-via-sops
SMTP_PASSWORD: change-me-via-sops
EMAIL_FROM: AMPM <no-reply@example.com>
# Client sign-in codes by SMS (D-147) through a DLT-registered provider: 2factor (needs SMS_SENDER_ID,
# and SMS_OTP_TEMPLATE is the DLT content-template ID) or msg91 (SMS_OTP_TEMPLATE is MSG91's template ID;
# whitelist the server's outgoing IP on the key). Staging may instead run SMS_PROVIDER=console with
# CLIENT_OTP_SCREEN_ECHO="true", which shows each code on screen; production refuses console without it.
SMS_PROVIDER: 2factor
SMS_API_KEY: change-me-via-sops
SMS_SENDER_ID: AMPMXX
SMS_OTP_TEMPLATE: change-me-dlt-template-id
SMS_DLT_ENTITY_ID: change-me-dlt-entity-id
CLIENT_OTP_SCREEN_ECHO: "false"
# Razorpay (feature 8.3, T-3): test keys on staging, live keys on production. PAYMENT_PROVIDER must be
# `razorpay` (production refuses the dev `stub`); register a webhook whose secret is RAZORPAY_WEBHOOK_SECRET.
PAYMENT_PROVIDER: razorpay
RAZORPAY_KEY_ID: change-me-via-sops
RAZORPAY_KEY_SECRET: change-me-via-sops
RAZORPAY_WEBHOOK_SECRET: change-me-via-sops
# Bot check on the website's public forms (C1): production refuses the accept-anything stub. Cloudflare
# Turnstile's siteverify endpoint; the matching site key is a build argument of the website, not a secret.
BOT_CHECK_PROVIDER: siteverify
BOT_CHECK_URL: https://challenges.cloudflare.com/turnstile/v0/siteverify
BOT_CHECK_SECRET: change-me-via-sops
# Media store. The S3 bucket + CDN is the target (feature 6.4); on the single-VPS deployment media lives
# on a persistent, backed-up host directory (D-106), which production accepts only with the explicit
# STORAGE_LOCAL_PERSISTENT=true and a MEDIA_SIGNING_SECRET (>= 32 chars) for the 15-minute download links.
STORAGE_PROVIDER: local
STORAGE_LOCAL_DIR: /data/storage
STORAGE_LOCAL_PERSISTENT: "true"
MEDIA_SIGNING_SECRET: change-me-via-sops-at-least-32-characters
# The upload virus scan (AC-20.3): clamd in the production compose's clamav service. Production refuses
# the `stub` scanner, which flags only the EICAR test file. Not secrets; listed so the zone is complete.
AV_PROVIDER: clamav
CLAMAV_HOST: clamav
# Sentry error reporting (feature 6.7): the app + worker read SENTRY_DSN to report errors to Sentry
# (external, hosted). The SDK is wired by a later app feature; this is the seam. A DSN is a write-only
# ingest key, but still environment-specific — use a separate Sentry project/DSN for staging vs production.
SENTRY_DSN: https://change-me-via-sops@o000000.ingest.sentry.io/0000000
