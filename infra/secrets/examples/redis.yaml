# Template for the redis secret zone (feature 6.4). Copy to infra/secrets/<env>.redis.yaml, fill, and
# encrypt to infra/secrets/<env>.redis.enc.yaml with sops. Consumed by: the redis service only — it holds
# nothing but the password, so a redis compromise never leaks DB, S3 or app secrets. See infra/runbooks/secrets.md.
REDIS_PASSWORD: change-me-via-sops
