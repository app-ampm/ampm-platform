# Template for the monitoring secret zone (feature 6.7). Copy to infra/secrets/<env>.monitoring.yaml,
# fill, and encrypt to infra/secrets/<env>.monitoring.enc.yaml with sops. Consumed by: Alertmanager, which
# reads ALERT_WEBHOOK_URL as a url_file (infra/scripts/decrypt-secrets.sh extracts just this key to
# monitoring-secrets/webhook_url). This zone is OPTIONAL — without it the app still deploys and the alert
# pipeline runs, but pages do not deliver until the webhook is set (decrypt-secrets warns loudly).
#
# ALERT_WEBHOOK_URL is a capability secret: anyone holding it can post to the pager. Point it at the
# developer's paging channel — a Slack/Discord/Teams incoming webhook, a PagerDuty Events v2 endpoint, or
# a self-hosted receiver. Production and staging get DIFFERENT URLs so staging pages a quieter channel.
ALERT_WEBHOOK_URL: https://hooks.example.com/services/change-me-via-sops
