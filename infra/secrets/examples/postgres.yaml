# Template for the postgres / pgBackRest secret zone (feature 6.4). Copy to infra/secrets/<env>.postgres.yaml,
# fill real values, then encrypt to infra/secrets/<env>.postgres.enc.yaml with sops (see infra/runbooks/secrets.md)
# and commit ONLY the .enc.yaml. Consumed by: the postgres and pgbackrest services (the DB / backup tier).
# Deliberately holds NO SMTP / Cognito / Razorpay keys — those belong to the app zone (least privilege).
POSTGRES_USER: ampm
POSTGRES_PASSWORD: change-me-via-sops
POSTGRES_DB: ampm
# pgBackRest and the sidecar's job_runs recorder authenticate with libpq via PGPASSWORD (pg_hba is
# scram-only). Must equal POSTGRES_PASSWORD, or backups fail and WAL fills the disk.
PGPASSWORD: change-me-via-sops
DATABASE_URL: postgresql://ampm:change-me-via-sops@postgres:5432/ampm
# pgBackRest repository: the encrypted S3 bucket in Mumbai. REPO1_PATH overrides the posix default for S3.
PGBACKREST_REPO1_TYPE: s3
PGBACKREST_REPO1_PATH: /ampm
PGBACKREST_REPO1_S3_BUCKET: ampm-backups
PGBACKREST_REPO1_S3_ENDPOINT: s3.ap-south-1.amazonaws.com
PGBACKREST_REPO1_S3_REGION: ap-south-1
PGBACKREST_REPO1_S3_KEY: change-me-via-sops
PGBACKREST_REPO1_S3_KEY_SECRET: change-me-via-sops
PGBACKREST_REPO1_CIPHER_PASS: change-me-via-sops
