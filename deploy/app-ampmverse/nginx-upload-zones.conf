# The http-context zones that the optional tier of plesk-nginx-directives.conf uses (D-177). nginx accepts a
# zone only in its http block, which a domain's "Additional nginx directives" cannot reach, so the box's root
# admin installs this file:
#   cp nginx-upload-zones.conf /etc/nginx/conf.d/ampm-upload-zones.conf && nginx -t && systemctl reload nginx
# Plesk's nginx.conf includes conf.d/*.conf inside http. Nothing uses the zones until the optional tier is
# applied, so installing this changes no request on its own.
#
# Per client address (nginx is the front server, so $binary_remote_addr is the caller's own address):
# uploads at 30 a minute on average after a burst of 20, so a gallery batch goes at once, and 4 in
# flight at a time. A 10 MB zone holds the state of about 160,000 addresses.
limit_req_zone $binary_remote_addr zone=ampm_uploads:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=ampm_upload_conns:10m;
