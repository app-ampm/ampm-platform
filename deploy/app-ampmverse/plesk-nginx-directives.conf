# app.ampmverse.com's "Additional nginx directives" (D-177; hotel information form plan §4.5, "At the edge"):
# Plesk > Domains > app.ampmverse.com > Apache & nginx Settings. Plesk puts them in the domain's server blocks
# and tests the configuration before applying it. The SSH user can neither read nor change Plesk's
# configuration, so someone with Plesk panel access pastes this file; the box's root admin adds
# nginx-upload-zones.conf for the optional tier. Afterwards, run check-edge-limits.sh from any machine.
#
# Measured on 24 Nov 2026: nginx passed at least 40 MiB to an upload route (Plesk sets 128m at http level),
# the API aborted it at 26 MB and Apache answered a 502 page; a 2 MiB JSON body reached the API, which
# answered its own 413. There was no effective limit at the edge.

# --- Required tier -----------------------------------------------------------------------------------
# The largest upload is media, capped at 25 MiB by the API (documents 20 MiB, import CSVs 5 MiB), so nginx
# refuses anything over 32m with its own 413, before buffering or proxying it. A server-level value
# overrides Plesk's http-level 128m. client_body_timeout is the longest pause allowed between two reads of
# a body, so a stalled upload is cut off after 30 s instead of holding a connection.
#
# If Plesk refuses this file because "client_max_body_size" is a duplicate, the domain's "Maximum allowed
# HTTP request body size" field, on the same Apache & nginx Settings page, is set: Plesk then writes its
# own client_max_body_size into the same server block. Use that field instead: set it to 32 MB (1 MB for
# the optional tier below, whose location block keeps its own 32m) and delete the client_max_body_size
# line here, or clear the field and keep the line. check-edge-limits.sh checks either way.
client_max_body_size 32m;
client_body_timeout 30s;

# --- Optional hardening tier (the plan's split) ------------------------------------------------------
# Keeps every other request to 1m, lets only the upload and import routes take 32m, and limits uploads
# per client address. To apply it:
#  1. root puts nginx-upload-zones.conf in /etc/nginx/conf.d/, runs `nginx -t` and reloads nginx;
#  2. someone with root copies the proxy lines of the domain's generated `location / { ... }` block (Plesk's
#     proxy_pass to Apache with its proxy_set_header and related lines), from
#     /etc/nginx/plesk.conf.d/vhosts/app.ampmverse.com.conf, into the marked place below. Without them this
#     location would answer by itself instead of proxying to Apache, and every upload would fail;
#  3. in this box, delete the required tier's `client_max_body_size 32m;` line, uncomment the block below
#     (keep client_body_timeout), and apply. If the "Maximum allowed HTTP request body size" field is in
#     use instead (see the required tier), set it to 1 MB and leave `client_max_body_size 1m;` commented;
#  4. run `check-edge-limits.sh --hardened`.
# The routes are the API's UPLOAD_PATHS and POST_GUARD_PATHS (apps/api/src/common/app-error.filter.ts)
# under /_api. When a route joins either list (the hotel form's public uploads, Slice 9), add it here too.
