# Example of the box-only Compose override the app.ampmverse.com test box keeps at
# infra/compose/local/compose.test-override.yml. Copy this to that path on the box; the real file is not
# committed because it is box-specific (like httpdocs/.htaccess, whose template is deploy/app-ampmverse/).
# It publishes the API and the public website on the box's loopback only and points both at their
# public origins. No secrets: the token-signing key comes from the box's own infra/compose/local/.env.
name: ampm-local

# The box's token-signing key, never the development value committed in compose.yml: /_api is reachable
# from the internet, so a key anyone with the repository can read would let them forge tokens. It lives in
# infra/compose/local/.env on the box (gitignored and dockerignored, mode 600), generated there with
#   umask 077; printf 'AMPM_BOX_IDENTITY_SECRET=%s\n' "$(openssl rand -base64 48 | tr -d '/+=\n')" > infra/compose/local/.env
# Compose reads that file for interpolation; changing the key signs every tester out.
x-box-identity-secret: &box-identity-secret "${AMPM_BOX_IDENTITY_SECRET:?set AMPM_BOX_IDENTITY_SECRET in infra/compose/local/.env on the box}"

# The media download-signing key (D-106): media is stored on the box disk (STORAGE_PROVIDER=local with
# STORAGE_LOCAL_PERSISTENT=true), and this HMAC key signs the 15-minute /media/blob URLs. Like the identity
# key it lives only in infra/compose/local/.env on the box, appended there with
#   umask 077; printf 'AMPM_BOX_MEDIA_SIGNING_SECRET=%s\n' "$(openssl rand -base64 48 | tr -d '/+=\n')" >> infra/compose/local/.env
x-box-media-secret: &box-media-secret "${AMPM_BOX_MEDIA_SIGNING_SECRET:?set AMPM_BOX_MEDIA_SIGNING_SECRET in infra/compose/local/.env on the box}"

services:
  api:
    ports:
      - "127.0.0.1:7001:3900" # loopback only; httpdocs/.htaccess [P] proxies /_api to this
    environment:
      # Browser origins that call the API: the client portals (app.) and the website's enquiry form (site.).
      CORS_ORIGINS: "https://app.ampmverse.com,https://site.ampmverse.com"
      WEB_APP_URL: "https://app.ampmverse.com"
      TRUST_PROXY: "1"
      IDENTITY_LOCAL_SECRET: *box-identity-secret
      # Local object store on the box disk (D-106). The container root FS is read-only, so the store is a
      # writable host bind-mount (below), owned by the container's node uid (1000); media uploaded through
      # the photo manager lands here and the /media/blob download route reads it back. One-time host setup
      # (mkdir + chown 1000) is in docs/engineering/test-deploy.md. STORAGE_LOCAL_PERSISTENT=true is what
      # lets env.ts accept the local store once NODE_ENV=production (the volume is persistent + backed up);
      # MEDIA_SIGNING_SECRET signs the download URLs. The S3-in-Mumbai path (infra.md) supersedes this later.
      STORAGE_LOCAL_DIR: "/data/storage"
      STORAGE_LOCAL_PERSISTENT: "true"
      MEDIA_SIGNING_SECRET: *box-media-secret
    volumes:
      # Host dir owned by uid 1000, created once (see test-deploy.md). The uploaded media is the only
      # persistent state outside Postgres — a box rebuild keeps the photos only if this dir survives.
      - /var/www/vhosts/app.ampmverse.com/ampm-storage:/data/storage
    deploy:
      resources:
        limits: { cpus: "1", memory: 1g }

  worker:
    environment:
      IDENTITY_LOCAL_SECRET: *box-identity-secret
      # The same object store as the API, so any worker job that touches media uses the same dir (D-106).
      STORAGE_LOCAL_DIR: "/data/storage"
      STORAGE_LOCAL_PERSISTENT: "true"
      MEDIA_SIGNING_SECRET: *box-media-secret
    volumes:
      - /var/www/vhosts/app.ampmverse.com/ampm-storage:/data/storage
    deploy:
      resources:
        limits: { cpus: "1", memory: 1g }

  # The public website (apps/web) at site.ampmverse.com, whose .htaccess
  # (deploy/site-ampmverse/htaccess.example) proxies every request to this container. Built and
  # restarted by deploy/redeploy-site.sh.
  web:
    build:
      context: ../../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        # Inlined at build time. The enquiry form posts to the API through app.'s /_api proxy, a
        # different origin from the site, as it will be under Caddy in production; "Client sign-in"
        # opens the portal.
        NEXT_PUBLIC_API_URL: "https://app.ampmverse.com/_api"
        NEXT_PUBLIC_PORTAL_URL: "https://app.ampmverse.com"
    ports:
      - "127.0.0.1:7002:3000" # loopback only; the site's .htaccess [P] proxies to this
    # A network of its own: the site reaches the API as a visitor's browser does, through the public URL.
    networks: [site]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    read_only: true
    # Next's data and image cache is the server's only write.
    tmpfs: ["/tmp", "/site/apps/web/.next/cache"]
    deploy:
      resources:
        limits: { cpus: "1", memory: 1g }
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

networks:
  site: {}
