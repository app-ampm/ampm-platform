# Example of the box-only Compose override the app.ampmverse.com test box keeps at
# infra/compose/local/compose.test-override.yml. Copy this to that path on the box; the real file is not
# committed because it is box-specific (like httpdocs/.htaccess, whose template is deploy/app-ampmverse/).
# It publishes the API and the public website on the box's loopback only and points both at their
# public origins. No secrets.
name: ampm-local
services:
  api:
    ports:
      - "127.0.0.1:7001:3900" # loopback only; httpdocs/.htaccess [P] proxies /_api to this
    environment:
      # Browser origins that call the API: the client portals (app.) and the website's enquiry form (site.).
      CORS_ORIGINS: "https://app.ampmverse.com,https://site.ampmverse.com"
      WEB_APP_URL: "https://app.ampmverse.com"
      TRUST_PROXY: "1"

  # The public website (apps/web) at site.ampmverse.com, whose .htaccess
  # (deploy/site-ampmverse/htaccess.example) proxies every request to this container. Built and
  # restarted by deploy/redeploy-site.sh.
  web:
    build:
      context: ../../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        # Inlined at build time. The enquiry form posts to the API through app.'s /_api proxy, a
        # different origin from the site, as it will be under Caddy in production; "Client sign-in"
        # opens the portal.
        NEXT_PUBLIC_API_URL: "https://app.ampmverse.com/_api"
        NEXT_PUBLIC_PORTAL_URL: "https://app.ampmverse.com"
    ports:
      - "127.0.0.1:7002:3000" # loopback only; the site's .htaccess [P] proxies to this
    # A network of its own: the site reaches the API as a visitor's browser does, through the public URL.
    networks: [site]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    read_only: true
    # Next's data and image cache is the server's only write.
    tmpfs: ["/tmp", "/site/apps/web/.next/cache"]
    deploy:
      resources:
        limits: { cpus: "1", memory: 1g }
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

networks:
  site: {}
