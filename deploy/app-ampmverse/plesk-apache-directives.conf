# app.ampmverse.com's "Additional Apache directives" (D-177; hotel information form plan §4.5, "At the edge"):
# Plesk > Domains > app.ampmverse.com > Apache & nginx Settings. Paste this file into both boxes, "Additional
# directives for HTTP" and "Additional directives for HTTPS": Plesk's nginx reaches Apache over either.
# It belongs in the vhost, not in httpdocs/.htaccess, which does not allow <Location>. Apache sits behind
# nginx, so this holds even if nginx's limits are ever changed. Afterwards, run check-edge-limits.sh from
# any machine.

# No request body to the API over 32 MiB: the largest upload is media, capped at 25 MiB by the API.
<Location /_api>
    LimitRequestBody 33554432
</Location>

# No RequestReadTimeout here, on purpose. mod_reqtimeout's stock configuration on Debian and Ubuntu
# (mods-available/reqtimeout.conf) already sets header=20-40,MinRate=500 body=10,MinRate=500: 20 s for the
# headers, up to 40 s while they arrive at 500 bytes a second or more, and 10 s for the body, extended a
# second for every 500 bytes. A vhost line with body=30 would only loosen the body's timeout. The client's
# own pauses are nginx's to cut off (client_body_timeout, plesk-nginx-directives.conf).
